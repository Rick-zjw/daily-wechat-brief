name: Daily WeChat Brief

on:
  schedule:
    # 北京时间 08:30 = UTC 00:30（早报）
    - cron: '30 0 * * *'
    # 北京时间 18:10 = UTC 10:10（晚报）
    - cron: '10 10 * * *'
  workflow_dispatch:
    inputs:
      brief_slot:
        description: '推送场次（auto / morning / evening）'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send daily brief
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          CITY_NAME: ${{ vars.CITY_NAME }}
          LATITUDE: ${{ vars.LATITUDE }}
          LONGITUDE: ${{ vars.LONGITUDE }}
          TIMEZONE: Asia/Shanghai
          BRIEF_SLOT: ${{ inputs.brief_slot || 'auto' }}
        run: node src/index.js
